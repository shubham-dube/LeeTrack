<!DOCTYPE html>
<html lang="en">
<head>
    <title>LeetCode Tracker</title>
    <script src="popup.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { width: 360px; }
        .chat-container {
            max-height: 200px;
            overflow-y: auto;
        }
        .chat-message {
            word-break: break-word;
        }
    </style>
</head>
<body class="bg-gray-50 p-4">
    <div class="space-y-4">
        <!-- Header -->
        <div class="flex items-center justify-between">
            <h3 class="text-xl font-bold text-gray-800">LeetCode Tracker</h3>
            <div id="connectionStatus" class="px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800">Disconnected</div>
        </div>

        <!-- Timer Section -->
        <div class="bg-white rounded-lg p-4 shadow-sm border border-gray-200">
            <div id="timerDisplay" class="text-3xl font-bold text-center text-gray-800">00:00:00</div>
            <div id="contestStatus" class="mt-2 text-sm text-center text-gray-600">No active contest</div>
        </div>

        <!-- Running Contests Section -->
        <div id="runningContests" class="bg-white rounded-lg p-4 shadow-sm border border-gray-200 space-y-3">
            <h4 class="font-semibold text-gray-700">Running Contests</h4>
            <div id="contestsList" class="space-y-2">
                <!-- Contest items will be added here dynamically -->
            </div>
        </div>

        <!-- Join Room Form -->
        <div id="joinForm" class="bg-white rounded-lg p-4 shadow-sm border border-gray-200 space-y-3">
            <h4 class="font-semibold text-gray-700">Join Room</h4>
            <input type="text" id="roomCode" placeholder="Room Code" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="name" placeholder="Your Name" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="rollNumber" placeholder="Roll Number" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="joinRoom" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition-colors">
                Join Room
            </button>
        </div>

        <!-- Room Status -->
        <div id="roomStatus" class="text-sm text-center text-gray-600">Not in a room</div>

        <!-- Chat Section (initially hidden) -->
        <div id="chatSection" class="hidden bg-white rounded-lg p-4 shadow-sm border border-gray-200 space-y-3">
            <h4 class="font-semibold text-gray-700">Room Chat</h4>
            <div id="chatMessages" class="chat-container space-y-2 mb-3">
                <!-- Messages will be added here dynamically -->
            </div>
            <div class="flex space-x-2">
                <input type="text" id="messageInput" placeholder="Type a message..." 
                    class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="sendMessage" class="px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                    Send
                </button>
            </div>
        </div>
    </div>
</body>
</html>
