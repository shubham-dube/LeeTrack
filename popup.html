<!DOCTYPE html>
<html lang="en">
<head>
    <title>LeetCode Tracker</title>
    <script src="popup.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { width: 360px; }
        .chat-container {
            max-height: 200px;
            overflow-y: auto;
        }
        .chat-message {
            word-break: break-word;
        }
    </style>
</head>
<body class="bg-gray-50 p-4">

    <div class="space-y-4">
        
        <!-- Header -->
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <img src="images/leet-logo.png" alt="LeetCode Tracker Logo" class="h-10 w-auto" />
                <h3 class="text-xl font-bold text-gray-700">LeeTrack</h3>
            </div>
            <div id="connectionStatus" class="px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800">Disconnected</div>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="bg-white rounded-lg p-4 shadow-sm border border-gray-200">
            <h4 class="font-semibold text-gray-700 mb-2">Login</h4>
            <input type="email" id="email" placeholder="Email" 
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-2">
            
            <input type="password" id="leetrackPassword" placeholder="LeeTrack Passowrd" 
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-2">
            
            <button id="loginBtn" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition-colors">
                Login
            </button>
        </div>

        <!-- Contest Status Section -->
        <div id="contestSection" class="bg-white rounded-lg p-4 shadow-sm border border-gray-200 hidden">
            <h4 class="font-semibold text-gray-700 mb-2">Active Contest</h4>
            <div id="contestStatus" class="text-xl font-bold text-center text-gray-800 p-2 bg-blue-50 rounded-md">No active contest</div>
        </div>

        <!-- Running Contests Section -->
        <div id="runningContests" class="bg-white rounded-lg p-4 shadow-sm border border-gray-200 space-y-3 hidden">
            <h4 class="font-semibold text-gray-700">Running Contests</h4>
            <div id="contestsList" class="space-y-2">
                <!-- Contest items will be added here dynamically -->
            </div>
        </div>

        <!-- Join Room Button -->
        <div class="bg-white rounded-lg p-4 shadow-sm border border-gray-200 hidden">
            <h4 class="font-semibold text-gray-700">Join Contest</h4>
            <div class="flex space-x-2">
                <input type="text" id="roomIdInput" placeholder="Enter Room ID" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="joinRoomBtn" class="px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                    Join Room
                </button>
            </div>
        </div>

        <!-- Room Status -->
        <div id="roomStatus" class="text-sm text-center text-gray-600">Not in a contest</div>

        <!-- Chat Section -->
        <div id="chatSection" class="hidden bg-white rounded-lg p-4 shadow-sm border border-gray-200 space-y-3">
            <div class="flex justify-between items-center">
                <h4 class="font-semibold text-gray-700">Contest Chat</h4>
                <button id="refreshChat" class="text-sm text-blue-600 hover:text-blue-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
            <div id="chatMessages" class="chat-container space-y-2 mb-3">
                <!-- Messages will be added here dynamically -->
            </div>
            <div class="flex space-x-2">
                <input type="text" id="messageInput" placeholder="Type a message..." 
                    class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="sendMessage" class="px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                    Send
                </button>
            </div>
        </div>

        <!-- Logout Button -->
        <div class="text-center">
            <button id="logoutBtn" class="mt-4 bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 transition-colors">
                Logout
            </button>
        </div>

    </div>

</body>
</html>
